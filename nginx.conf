server {
    listen 80;
    # También IPv6: dentro del contenedor "localhost" es ::1 y el HEALTHCHECK del Dockerfile lo usa
    listen [::]:80;
    server_name localhost;

    # Carpeta raíz con los archivos compilados de Angular
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para mejor rendimiento
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # -------------------------------------------------------
    # Cabeceras de seguridad: las mismas de public/_headers (que solo lee Cloudflare), para que
    # el Docker local se comporte como producción. Si cambias una política, cámbiala en los dos.
    # Diferencias: aquí el navegador llama al backend en http://localhost:8080 (connect-src) y no
    # hay HTTPS, así que no va Strict-Transport-Security.
    # Ojo: si una "location" de abajo usa add_header, deja de heredar estas.
    # -------------------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' http://localhost:8080 https://nominatim.openstreetmap.org; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # -------------------------------------------------------
    # Proxy hacia el backend Spring Boot
    # Todas las rutas /api/* van al backend
    # -------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
    }

    # -------------------------------------------------------
    # Angular SPA - redirige todo lo demás al index.html
    # Necesario para que funcione el routing de Angular
    # -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El service worker se revisa en cada visita (el resto de .js se guarda un año)
    location = /sw.js {
        expires -1;
    }

    # Cache para assets estáticos (imágenes, fuentes, etc.).
    # "expires" ya manda Cache-Control: max-age; sin add_header aquí se heredan las cabeceras de seguridad.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
    }
}
