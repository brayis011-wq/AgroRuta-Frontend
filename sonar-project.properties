sonar.projectKey=AgrorutaFrontend
sonar.projectName=AgrorutaFrontend
sonar.host.url=http://localhost:9000
# El token se lee de la variable de entorno SONAR_TOKEN (no lo pongas aquí)
sonar.sources=src/app
sonar.tests=src/app
sonar.test.inclusions=**/*.spec.ts
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/*.module.ts,**/*.routes.ts,**/*.index.ts,**/*.css,**/*.scss

sonar.coverage.exclusions=**/*.module.ts,**/*.routes.ts,**/*.index.ts,src/app/features/layout/**,src/app/features/configuration/**,src/app/core/interceptors/**,src/app/core/handlers/**

sonar.typescript.lcov.reportPaths=coverage/lcov.info

sonar.scm.disabled=true
