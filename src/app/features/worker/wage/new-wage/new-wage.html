<div class="page">
  <div class="page-header">
    <div>
      <a routerLink="../" class="btn-back">← Jornales</a>
      <h1 class="page-title">Registrar Jornal</h1>
      <p class="page-subtitle">Registra el trabajo diario de un trabajador</p>
    </div>
  </div>

  <div class="form-card">
    <div *ngIf="error" class="alerta-error" role="alert">{{ error }}</div>
    <form [formGroup]="form" (ngSubmit)="guardar()">

      <div class="seccion">
        <h3 class="seccion-titulo">
          <span aria-hidden="true">👷</span> Información del Jornal
        </h3>
        <div class="grid-2">
          <div class="campo">
            <label for="trabajadorId">Trabajador *</label>
            <select id="trabajadorId" formControlName="trabajadorId"
                    [class.invalido]="invalido('trabajadorId')">
              <option [ngValue]="null" disabled>Selecciona un trabajador</option>
              <option *ngFor="let t of trabajadores" [ngValue]="t.id">
                {{ t.nombreCompleto }}{{ t.cargo ? ' — ' + t.cargo.nombre : '' }}
              </option>
            </select>
            <span *ngIf="invalido('trabajadorId')" class="error-msg">Requerido</span>
          </div>
          <div class="campo">
            <label for="fecha">Fecha *</label>
            <input id="fecha" formControlName="fecha" type="date"
                   [class.invalido]="invalido('fecha')"/>
            <span *ngIf="invalido('fecha')" class="error-msg">Requerido</span>
          </div>
          <div class="campo">
            <label for="cultivoId">ID del Cultivo *</label>
            <input id="cultivoId" formControlName="cultivoId" type="number"
                   placeholder="ID del cultivo"
                   [class.invalido]="invalido('cultivoId')"/>
            <span *ngIf="invalido('cultivoId')" class="error-msg">Requerido</span>
          </div>
          <div class="campo">
            <label for="nombreCultivo">Nombre del Cultivo *</label>
            <input id="nombreCultivo" formControlName="nombreCultivo" type="text"
                   placeholder="Ej: Café Arábiga Lote 3"
                   [class.invalido]="invalido('nombreCultivo')"/>
            <span *ngIf="invalido('nombreCultivo')" class="error-msg">Requerido</span>
          </div>
          <div class="campo campo-full">
            <label for="observaciones">Observaciones</label>
            <input id="observaciones" formControlName="observaciones" type="text"
                   placeholder="Notas adicionales (opcional)"/>
          </div>
        </div>
      </div>

      <div class="seccion">
        <h3 class="seccion-titulo">
          <span aria-hidden="true">✅</span> Actividades Realizadas *
        </h3>
        <div class="actividades-grid">
          <button
            type="button"
            *ngFor="let a of actividades"
            class="actividad-chip"
            [class.seleccionada]="a.id != null && actividadesSeleccionadas.has(a.id)"
            [attr.aria-pressed]="a.id != null && actividadesSeleccionadas.has(a.id)"
            (click)="toggleActividad(a.id)">
            <span class="chip-check" aria-hidden="true">
              {{ (a.id != null && actividadesSeleccionadas.has(a.id)) ? '✔' : '○' }}
            </span>
            <div>
              <div class="chip-nombre">{{ a.nombre }}</div>
              <div class="chip-desc">{{ a.descripcion }}</div>
            </div>
          </button>
        </div>
        <p *ngIf="actividadesSeleccionadas.size === 0" class="texto-suave"
           style="margin-top:0.5rem">
          Selecciona al menos una actividad
        </p>
        <p *ngIf="actividadesSeleccionadas.size > 0" class="texto-verde"
           style="margin-top:0.5rem">
          {{ actividadesSeleccionadas.size }} actividad(es) seleccionada(s)
        </p>
      </div>

      <div class="form-footer">
        <a routerLink="../" class="btn-secundario">Cancelar</a>
        <button type="submit" class="btn-primary" [disabled]="guardando">
          {{ guardando ? 'Registrando...' : 'Registrar Jornal' }}
        </button>
      </div>

    </form>
  </div>
</div>
