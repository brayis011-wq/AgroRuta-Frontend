<div class="page-bg">
  <div class="container">

    <button class="btn-back" (click)="volver()">
      <i class="ti ti-arrow-left" aria-hidden="true"></i>
      <span>{{ 'siembra.activity.back' | translate }}</span>
    </button>

    <div class="form-header">
      <div class="form-header__icon" aria-hidden="true"><i class="ti ti-clipboard-list"></i></div>
      <div>
        <h2>{{ (registroId ? 'temporadas.registro.editActivity' : 'siembra.activity.title') | translate }}</h2>
        <p>{{ 'siembra.activity.subtitle' | translate }}</p>
      </div>
    </div>

    <div class="alert alert--error" *ngIf="error" role="alert">
      <i class="ti ti-alert-triangle alert__icon" aria-hidden="true"></i>
      {{ error | translate }}
    </div>
    <div class="alert alert--success" *ngIf="exito" role="alert">
      <i class="ti ti-circle-check alert__icon" aria-hidden="true"></i>
      {{ exito | translate }}
    </div>

    <div class="form-card">

      <div class="form-card__accent"></div>

      <form (ngSubmit)="onSubmit()" #actividadForm="ngForm">

        <!-- Tipo de actividad: selector visual -->
        <fieldset class="field">
          <legend class="field__label">{{ 'siembra.activity.type' | translate }}</legend>
          <div class="tipo-grid">
            <button
              type="button"
              *ngFor="let tipo of tiposActividad"
              class="tipo-chip"
              [class.tipo-chip--active]="form.tipo === tipo"
              [attr.aria-pressed]="form.tipo === tipo"
              (click)="form.tipo = tipo"
            >
              <i class="ti tipo-chip__icon" [class]="'ti tipo-chip__icon ' + tipoIconos[tipo]" aria-hidden="true"></i>
              <span class="tipo-chip__label">{{ 'enums.tipoActividad.' + tipo | translate }}</span>
            </button>
          </div>
          <input type="hidden" [(ngModel)]="form.tipo" name="tipo" required />
        </fieldset>

        <!-- Descripción -->
        <div class="field">
          <label class="field__label" for="descripcion">{{ 'siembra.activity.description' | translate }}</label>
          <div class="field__input-wrap">
            <textarea
              id="descripcion"
              [(ngModel)]="form.descripcion"
              name="descripcion"
              [placeholder]="'siembra.activity.descriptionPlaceholder' | translate"
              rows="4"
              required
            ></textarea>
            <div class="field__underline" aria-hidden="true"></div>
          </div>
        </div>

        <!-- Fecha -->
        <div class="field">
          <label class="field__label" for="fecha">
            <i class="ti ti-calendar" aria-hidden="true"></i> {{ 'siembra.activity.date' | translate }}
          </label>
          <div class="field__input-wrap">
            <input
              id="fecha"
              type="date"
              [(ngModel)]="form.fecha"
              name="fecha"
              required
            />
            <div class="field__underline" aria-hidden="true"></div>
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="costo"><i class="ti ti-cash" aria-hidden="true"></i> {{ 'temporadas.costos.activityCost' | translate }} <span class="label-optional">({{ 'common.optional' | translate }})</span></label>
          <div class="field__input-wrap">
            <input id="costo" type="number" min="0" step="any" inputmode="decimal" [(ngModel)]="form.costo" name="costo" placeholder="0" />
          </div>
          <small class="campo-hint">{{ 'temporadas.costos.activityCostHint' | translate }}</small>
        </div>

        <button type="submit" class="btn-submit" [disabled]="cargando || !form.tipo">
          <span class="btn-submit__text" *ngIf="!cargando">
            <span>{{ (registroId ? 'common.save' : 'siembra.activity.submit') | translate }}</span>
            <i class="ti ti-arrow-right btn-submit__arrow" aria-hidden="true"></i>
          </span>
          <span class="btn-submit__loader" *ngIf="cargando" aria-live="polite">
            <span class="spinner" aria-hidden="true"></span>
            {{ 'siembra.activity.saving' | translate }}
          </span>
        </button>

      </form>
    </div>

  </div>
</div>
