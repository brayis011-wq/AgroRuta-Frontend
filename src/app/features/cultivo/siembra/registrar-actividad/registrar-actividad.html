<div class="page-bg">
  <div class="container">

    <button class="btn-back" (click)="volver()">
      <span class="btn-back__arrow" aria-hidden="true">←</span>
      <span>{{ 'siembra.activity.back' | translate }}</span>
    </button>

    <div class="form-header">
      <div class="form-header__icon" aria-hidden="true">🌱</div>
      <div>
        <h2>{{ 'siembra.activity.title' | translate }}</h2>
        <p>{{ 'siembra.activity.subtitle' | translate }}</p>
      </div>
    </div>

    <div class="alert alert--error" *ngIf="error" role="alert">
      <span class="alert__icon" aria-hidden="true">⚠️</span>
      {{ error | translate }}
    </div>
    <div class="alert alert--success" *ngIf="exito" role="alert">
      <span class="alert__icon" aria-hidden="true">✅</span>
      {{ exito | translate }}
    </div>

    <div class="form-card">

      <div class="form-card__accent"></div>

      <form (ngSubmit)="onSubmit()" #actividadForm="ngForm">

        <!-- Tipo de actividad: selector visual -->
        <fieldset class="field">
          <legend class="field__label">{{ 'siembra.activity.type' | translate }}</legend>
          <div class="tipo-grid">
            <button
              type="button"
              *ngFor="let tipo of tiposActividad"
              class="tipo-chip"
              [class.tipo-chip--active]="form.tipo === tipo"
              [attr.aria-pressed]="form.tipo === tipo"
              (click)="form.tipo = tipo"
            >
              <span class="tipo-chip__icon" aria-hidden="true">{{ tipoIconos[tipo] }}</span>
              <span class="tipo-chip__label">{{ 'enums.tipoActividad.' + tipo | translate }}</span>
            </button>
          </div>
          <input type="hidden" [(ngModel)]="form.tipo" name="tipo" required />
        </fieldset>

        <!-- Descripción -->
        <div class="field">
          <label class="field__label" for="descripcion">{{ 'siembra.activity.description' | translate }}</label>
          <div class="field__input-wrap">
            <textarea
              id="descripcion"
              [(ngModel)]="form.descripcion"
              name="descripcion"
              [placeholder]="'siembra.activity.descriptionPlaceholder' | translate"
              rows="4"
              required
            ></textarea>
            <div class="field__underline" aria-hidden="true"></div>
          </div>
        </div>

        <!-- Fecha -->
        <div class="field">
          <label class="field__label" for="fecha">
            <span aria-hidden="true">📅</span> {{ 'siembra.activity.date' | translate }}
          </label>
          <div class="field__input-wrap">
            <input
              id="fecha"
              type="date"
              [(ngModel)]="form.fecha"
              name="fecha"
              required
            />
            <div class="field__underline" aria-hidden="true"></div>
          </div>
        </div>

        <button type="submit" class="btn-submit" [disabled]="cargando || !form.tipo">
          <span class="btn-submit__text" *ngIf="!cargando">
            <span>{{ 'siembra.activity.submit' | translate }}</span>
            <span class="btn-submit__arrow" aria-hidden="true">→</span>
          </span>
          <span class="btn-submit__loader" *ngIf="cargando" aria-live="polite">
            <span class="spinner" aria-hidden="true"></span>
            {{ 'siembra.activity.saving' | translate }}
          </span>
        </button>

      </form>
    </div>

  </div>
</div>
