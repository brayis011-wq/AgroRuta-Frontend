<div class="container">
  <div class="header">
    <div>
      <h2>🌱 {{ 'siembra.new.title' | translate }}</h2>
      <p class="subtitle">{{ 'siembra.new.subtitle' | translate }}</p>
    </div>
    <button class="btn-secondary" (click)="cancelar()">{{ 'siembra.new.back' | translate }}</button>
  </div>

  <div class="form-card">
    <form (ngSubmit)="registrar()">

      <div class="form-group">
        <label for="fechaSiembra">{{ 'siembra.new.date' | translate }}</label>
        <input id="fechaSiembra" type="date" [(ngModel)]="form.fechaSiembra"
               name="fechaSiembra" required />
      </div>

      <div class="form-group">
        <label for="cantidadPlantas">{{ 'siembra.new.plants' | translate }}</label>
        <input id="cantidadPlantas" type="number" [(ngModel)]="form.cantidadPlantas"
               name="cantidadPlantas" [placeholder]="'siembra.new.plantsPlaceholder' | translate" min="1" required />
      </div>

      <div class="form-group">
        <label for="variedad">{{ 'siembra.new.variety' | translate }}</label>
        <select id="variedad" [(ngModel)]="form.variedad" name="variedad" required>
          <option value="">{{ 'siembra.new.varietyPlaceholder' | translate }}</option>
          <option value="COLOMBIA">{{ 'enums.variedad.COLOMBIA' | translate }}</option>
          <option value="GIGANTE">{{ 'enums.variedad.GIGANTE' | translate }}</option>
          <option value="KENYA">{{ 'enums.variedad.KENYA' | translate }}</option>
        </select>
      </div>

      <div class="error" *ngIf="error">{{ error | translate }}</div>
      <div class="success" *ngIf="exito">{{ 'siembra.new.success' | translate }}</div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="cancelar()">{{ 'siembra.new.cancel' | translate }}</button>
        <button type="submit" class="btn-primary" [disabled]="guardando">
          {{ (guardando ? 'siembra.new.saving' : 'siembra.new.submit') | translate }}
        </button>
      </div>

    </form>
  </div>
</div>
