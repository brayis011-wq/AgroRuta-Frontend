<div class="container">
  <div class="header">
    <div>
      <h2>🌱 {{ 'siembra.new.title' | translate }}</h2>
      <p class="subtitle">{{ 'siembra.new.subtitle' | translate }}</p>
    </div>
    <button class="btn-secondary" (click)="cancelar()">{{ 'siembra.new.back' | translate }}</button>
  </div>

  <div class="form-card">
    <form (ngSubmit)="registrar()">

      <div class="form-group">
        <label for="fechaSiembra">{{ 'siembra.new.date' | translate }}</label>
        <input id="fechaSiembra" type="date" [max]="hoy" [(ngModel)]="form.fechaSiembra"
               name="fechaSiembra" required />
      </div>

      <div class="form-group">
        <label for="cantidadPlantas">{{ 'siembra.new.plants' | translate }}</label>
        <input id="cantidadPlantas" type="number" [(ngModel)]="form.cantidadPlantas"
               name="cantidadPlantas" [placeholder]="'siembra.new.plantsPlaceholder' | translate" min="1" required />
      </div>

      <div class="form-group">
        <label for="tipoCultivo">{{ 'siembra.new.crop' | translate }}</label>
        <select id="tipoCultivo" [ngModel]="form.tipoCultivoId" (ngModelChange)="elegirCultivo($event)"
                name="tipoCultivo" required>
          <option [ngValue]="null" disabled>
            {{ (cargandoCatalogo ? 'common.loading' : 'siembra.new.cropPlaceholder') | translate }}
          </option>
          @for (c of cultivos; track c.id) {
            <option [ngValue]="c.id">{{ c.nombre }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label for="variedad">{{ 'siembra.new.variety' | translate }}</label>
        <select id="variedad" [(ngModel)]="form.variedadId" name="variedad" required
                [disabled]="form.tipoCultivoId == null">
          <option [ngValue]="null" disabled>
            {{ (form.tipoCultivoId == null ? 'siembra.new.cropFirst' : 'siembra.new.varietyPlaceholder') | translate }}
          </option>
          @for (v of variedades; track v.id) {
            <option [ngValue]="v.id">{{ v.nombre }}</option>
          }
        </select>
      </div>

      <div class="error" *ngIf="error">{{ error | translate }}</div>
      <div class="success" *ngIf="exito">{{ 'siembra.new.success' | translate }}</div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="cancelar()">{{ 'siembra.new.cancel' | translate }}</button>
        <button type="submit" class="btn-primary" [disabled]="guardando">
          {{ (guardando ? 'siembra.new.saving' : 'siembra.new.submit') | translate }}
        </button>
      </div>

    </form>
  </div>
</div>
