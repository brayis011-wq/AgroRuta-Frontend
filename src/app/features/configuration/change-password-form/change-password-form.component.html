<form [formGroup]="form" (ngSubmit)="onSubmit()" class="password-form" novalidate>

  <!-- Contraseña actual -->
  <div class="field-group">
    <label class="field-label" for="passwordActual">
      Contraseña actual <span class="required">*</span>
    </label>
    <div class="input-wrapper">
      <input
        id="passwordActual"
        [type]="showActual ? 'text' : 'password'"
        class="field-input"
        [class.field-error]="isInvalid('passwordActual')"
        formControlName="passwordActual"
        placeholder="Tu contraseña actual"
      />
      <button type="button" class="toggle-eye" (click)="showActual = !showActual">
        {{ showActual ? '🙈' : '👁️' }}
      </button>
    </div>
    <span class="error-msg" *ngIf="isInvalid('passwordActual')">
      La contraseña actual es obligatoria
    </span>
  </div>

  <!-- Nueva contraseña -->
  <div class="field-group">
    <label class="field-label" for="nuevaPassword">
      Nueva contraseña <span class="required">*</span>
    </label>
    <div class="input-wrapper">
      <input
        id="nuevaPassword"
        [type]="showNueva ? 'text' : 'password'"
        class="field-input"
        [class.field-error]="isInvalid('nuevaPassword')"
        formControlName="nuevaPassword"
        placeholder="Mínimo 8 caracteres"
      />
      <button type="button" class="toggle-eye" (click)="showNueva = !showNueva">
        {{ showNueva ? '🙈' : '👁️' }}
      </button>
    </div>
    <span class="error-msg" *ngIf="isInvalid('nuevaPassword')">
      La contraseña debe tener al menos 8 caracteres
    </span>
  </div>

  <!-- Confirmar contraseña -->
  <div class="field-group">
    <label class="field-label" for="confirmarPassword">
      Confirmar nueva contraseña <span class="required">*</span>
    </label>
    <div class="input-wrapper">
      <input
        id="confirmarPassword"
        [type]="showConfirmar ? 'text' : 'password'"
        class="field-input"
        [class.field-error]="isInvalid('confirmarPassword') || mismatch"
        formControlName="confirmarPassword"
        placeholder="Repite la nueva contraseña"
      />
      <button type="button" class="toggle-eye" (click)="showConfirmar = !showConfirmar">
        {{ showConfirmar ? '🙈' : '👁️' }}
      </button>
    </div>
    <span class="error-msg" *ngIf="mismatch">
      Las contraseñas no coinciden
    </span>
    <span class="error-msg" *ngIf="isInvalid('confirmarPassword') && !mismatch">
      Debes confirmar la contraseña
    </span>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn-warning" [disabled]="loading">
      <span *ngIf="!loading">🔒 Cambiar contraseña</span>
      <span *ngIf="loading">Cambiando…</span>
    </button>
  </div>

</form>
