<form [formGroup]="form" (ngSubmit)="onSubmit()" class="profile-form" novalidate>

  <!-- Avatar preview -->
  <div class="avatar-section">
    <div class="avatar-wrapper">
      <img
        *ngIf="hasValidImage"
        [src]="fotoUrl"
        [alt]="'config.profile.photoAlt' | translate"
        class="avatar-img"
        (error)="onImageError()"
      />
      <div *ngIf="!hasValidImage" class="avatar-placeholder">
        {{ initials || '?' }}
      </div>
    </div>
    <div class="avatar-info">
      <p class="avatar-hint">{{ 'config.profile.photoHint' | translate }}</p>
    </div>
  </div>

  <!-- Foto URL -->
  <div class="field-group">
    <label class="field-label" for="fotoPerfil">{{ 'config.profile.photoUrl' | translate }}</label>
    <input
      id="fotoPerfil"
      type="url"
      class="field-input"
      formControlName="fotoPerfil"
      placeholder="https://example.com/my-photo.jpg"
      (input)="onFotoChange()"
    />
  </div>

  <!-- Nombre -->
  <div class="field-group">
    <label class="field-label" for="nombre">{{ 'config.profile.fullName' | translate }} <span class="required">*</span></label>
    <input
      id="nombre"
      type="text"
      class="field-input"
      [class.field-error]="isInvalid('nombre')"
      formControlName="nombre"
      [placeholder]="'config.profile.fullNamePlaceholder' | translate"
    />
    <span class="error-msg" *ngIf="isInvalid('nombre')">
      {{ 'config.profile.nameError' | translate }}
    </span>
  </div>

  <!-- Email (readonly) -->
  <div class="field-group">
    <label class="field-label" for="email">{{ 'config.profile.email' | translate }}</label>
    <input
      id="email"
      type="email"
      class="field-input field-readonly"
      formControlName="email"
      readonly
    />
    <span class="field-hint">{{ 'config.profile.emailHint' | translate }}</span>
  </div>

  <!-- Teléfono -->
  <div class="field-group">
    <label class="field-label" for="telefono">{{ 'config.profile.phone' | translate }} <span class="required">*</span></label>
    <input
      id="telefono"
      type="tel"
      class="field-input"
      [class.field-error]="isInvalid('telefono')"
      formControlName="telefono"
      placeholder="3001234567"
    />
    <span class="error-msg" *ngIf="isInvalid('telefono')">
      {{ 'config.profile.phoneError' | translate }}
    </span>
  </div>

  <!-- Rol (readonly, traducido) -->
  <div class="field-group">
    <label class="field-label" for="rol">{{ 'config.profile.role' | translate }}</label>
    <input
      id="rol"
      type="text"
      class="field-input field-readonly"
      [value]="perfil ? ('enums.rol.' + perfil.rol | translate) : ''"
      readonly
    />
    <span class="field-hint">{{ 'config.profile.roleHint' | translate }}</span>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn-primary" [disabled]="loading">
      <span *ngIf="!loading">💾 {{ 'config.profile.save' | translate }}</span>
      <span *ngIf="loading">{{ 'config.profile.saving' | translate }}</span>
    </button>
  </div>

</form>
