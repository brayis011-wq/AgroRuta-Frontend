<div class="config-page">

  <div class="topbar">
    <div>
      <h2 class="page-title">⚙️ {{ 'config.title' | translate }}</h2>
      <p class="page-subtitle">{{ 'config.subtitle' | translate }}</p>
    </div>
  </div>

  <div class="toast" *ngIf="toast"
       [class.toast-success]="toast.type === 'success'"
       [class.toast-error]="toast.type === 'error'">
    {{ toast.message | translate }}
  </div>

  <div class="skeleton-wrapper" *ngIf="loadingPage">
    <div class="skeleton-card">
      <div class="skeleton-line wide"></div>
      <div class="skeleton-line medium"></div>
      <div class="skeleton-line short"></div>
    </div>
    <div class="skeleton-card">
      <div class="skeleton-line wide"></div>
      <div class="skeleton-line medium"></div>
      <div class="skeleton-line short"></div>
    </div>
  </div>

  <div class="config-grid" *ngIf="!loadingPage">

    <div class="config-card">
      <div class="card-header">
        <span class="card-icon">👤</span>
        <div>
          <h3 class="card-title">{{ 'config.profileCard.title' | translate }}</h3>
          <p class="card-desc">{{ 'config.profileCard.desc' | translate }}</p>
        </div>
      </div>
      <app-profile-form
        [perfil]="perfil"
        [loading]="loadingProfile"
        (save)="onSaveProfile($event)"
      />
    </div>

    <div class="config-card">
      <div class="card-header">
        <span class="card-icon">🔐</span>
        <div>
          <h3 class="card-title">{{ 'config.passwordCard.title' | translate }}</h3>
          <p class="card-desc">{{ 'config.passwordCard.desc' | translate }}</p>
        </div>
      </div>
      <app-change-password-form
        [loading]="loadingPassword"
        (changePassword)="onChangePassword($event)"
      />
    </div>

  </div>
</div>
