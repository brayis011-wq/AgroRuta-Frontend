<div class="container">
  <div class="card">
    <app-language-switcher />
    <h2>AgroRuta</h2>
    <h3>{{ 'auth.register.title' | translate }}</h3>

    <div class="error" *ngIf="error">{{ error | translate }}</div>
    <div class="success" *ngIf="exito">{{ exito | translate }}</div>

    <form (ngSubmit)="onSubmit()" #registroForm="ngForm">
      <div class="field">
        <label for="nombre">{{ 'auth.register.fullName' | translate }}</label>
        <input
          id="nombre"
          type="text"
          [(ngModel)]="form.nombre"
          name="nombre"
          [placeholder]="'auth.register.fullNamePlaceholder' | translate"
        />
      </div>

      <div class="field">
        <label for="email">{{ 'auth.register.email' | translate }}</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="form.email"
          name="email"
          placeholder="tu@email.com"
        />
      </div>

      <div class="field">
        <label for="password">{{ 'auth.register.password' | translate }}</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="form.password"
          name="password"
          placeholder="••••••••"
        />
      </div>

      <div class="field">
        <label for="rol">{{ 'auth.register.role' | translate }}</label>
        <select id="rol" [(ngModel)]="form.rol" name="rol">
          <option value="Agricultor">{{ 'enums.rol.Agricultor' | translate }}</option>
          <option value="Trabajador">{{ 'enums.rol.Trabajador' | translate }}</option>
        </select>
      </div>

      <button type="submit" [disabled]="cargando">
        {{ (cargando ? 'auth.register.submitting' : 'auth.register.submit') | translate }}
      </button>
    </form>

    <p class="link">
      {{ 'auth.register.haveAccount' | translate }}
      <a routerLink="/auth/login">{{ 'auth.register.signIn' | translate }}</a>
    </p>
  </div>
</div>
