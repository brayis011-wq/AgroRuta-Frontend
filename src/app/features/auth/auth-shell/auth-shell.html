<div class="auth">
  <header class="top">
    <a class="brand" routerLink="/auth/login"><span class="logo" aria-hidden="true"><i class="ti ti-plant-2"></i></span>AgroRuta</a>
    <div class="barra">
      <app-language-switcher />
      <button type="button" class="ib" (click)="tema.alternar()"
              [title]="(tema.oscuro() ? 'theme.toLight' : 'theme.toDark') | translate"
              [attr.aria-label]="(tema.oscuro() ? 'theme.toLight' : 'theme.toDark') | translate">
        <i class="ti" [class.ti-moon]="!tema.oscuro()" [class.ti-sun]="tema.oscuro()" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <div class="cuerpo">
    <section class="arte">
      <app-auth-cultivo />
    </section>

    <main class="caja">
      <router-outlet />
    </main>
  </div>

  <footer class="pie">© {{ anio }} AgroRuta</footer>
</div>
