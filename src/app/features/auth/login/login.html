<div class="container">
  <div class="card">
    <app-language-switcher />
    <h2>AgroRuta</h2>
    <h3>{{ 'auth.login.title' | translate }}</h3>

    <div class="error" *ngIf="error">{{ error | translate }}</div>

    <form (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="email">{{ 'auth.login.email' | translate }}</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="form.email"
          name="email"
          [placeholder]="'auth.login.emailPlaceholder' | translate"
          required
        />
      </div>

      <div class="field">
        <label for="password">{{ 'auth.login.password' | translate }}</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="form.password"
          name="password"
          placeholder="••••••••"
          required
        />
      </div>

      <button type="submit" [disabled]="cargando">
        {{ (cargando ? 'auth.login.loggingIn' : 'auth.login.submit') | translate }}
      </button>
    </form>
    <p class="link">
      {{ 'auth.login.noAccount' | translate }}
      <a routerLink="/auth/registro">{{ 'auth.login.register' | translate }}</a>
    </p>
  </div>
</div>
