<div class="auth">
  <app-auth-escena />

  <main class="panel">
    <div class="barra">
      <app-language-switcher />
      <button type="button" class="ib" (click)="tema.alternar()"
              [title]="(tema.oscuro() ? 'theme.toLight' : 'theme.toDark') | translate"
              [attr.aria-label]="(tema.oscuro() ? 'theme.toLight' : 'theme.toDark') | translate">
        <i class="ti" [class.ti-moon]="!tema.oscuro()" [class.ti-sun]="tema.oscuro()" aria-hidden="true"></i>
      </button>
    </div>

    <div class="caja">
      <p class="eyebrow">{{ 'auth.login.eyebrow' | translate }}</p>
      <h1>{{ 'auth.login.title' | translate }}</h1>
      <p class="sub">{{ 'auth.login.subtitle' | translate }}</p>

      @if (error) {
        <p class="aviso error" role="alert"><i class="ti ti-alert-circle" aria-hidden="true"></i><span>{{ error | translate }}</span></p>
      }

      <form (ngSubmit)="onSubmit()">
        <div class="campo">
          <label for="email">{{ 'auth.login.email' | translate }}</label>
          <div class="entrada">
            <i class="ti ti-mail" aria-hidden="true"></i>
            <input id="email" type="email" [(ngModel)]="form.email" name="email" autocomplete="email"
                   [placeholder]="'auth.login.emailPlaceholder' | translate" required />
          </div>
        </div>

        <div class="campo">
          <label for="password">{{ 'auth.login.password' | translate }}</label>
          <div class="entrada con-ojo">
            <i class="ti ti-lock" aria-hidden="true"></i>
            <input id="password" [type]="verPass ? 'text' : 'password'" [(ngModel)]="form.password" name="password"
                   autocomplete="current-password" placeholder="••••••••" required />
        <button type="button" class="ojo" (click)="verPass = !verPass" [attr.aria-pressed]="verPass"
                [attr.aria-label]="(verPass ? 'config.password.hide' : 'config.password.show') | translate">
          <i class="ti" [class.ti-eye]="!verPass" [class.ti-eye-off]="verPass" aria-hidden="true"></i>
        </button>
          </div>
        </div>

        <button type="submit" class="btn-prim" [disabled]="cargando">
          <i class="ti" [class.ti-login-2]="!cargando" [class.ti-loader-2]="cargando" [class.gira]="cargando" aria-hidden="true"></i>
          {{ (cargando ? 'auth.login.loggingIn' : 'auth.login.submit') | translate }}
        </button>
      </form>

      <p class="link">
        {{ 'auth.login.noAccount' | translate }}
        <a routerLink="/auth/registro">{{ 'auth.login.register' | translate }}</a>
      </p>
    </div>
  </main>
</div>
